[workspace]
resolver = "2"
members = ["crates/protocol", "crates/agent"]
# O app Tauri tem seu próprio workspace (só compila no Windows com WebView2).
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
